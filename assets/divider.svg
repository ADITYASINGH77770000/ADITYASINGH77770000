<svg xmlns="http://www.w3.org/2000/svg" width="900" height="14" viewBox="0 0 900 14" role="img" aria-label="">
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#8E2DE2" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#8E2DE2"/>
      <stop offset="0.85" stop-color="#2575FC"/>
      <stop offset="1" stop-color="#2575FC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="track"><rect x="0" y="5" width="900" height="4" rx="2"/></clipPath>
  </defs>
  <rect x="0" y="6" width="900" height="2" rx="1" fill="url(#line)" opacity="0.7"/>
  <g clip-path="url(#track)">
    <rect x="-160" y="5" width="160" height="4" fill="url(#spark)">
      <animate attributeName="x" values="-160;900" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cx="450" cy="7" r="3" fill="#a78bfa">
    <animate attributeName="r" values="2.5;4;2.5" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
